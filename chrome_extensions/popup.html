<!DOCTYPE html>
<html>
<head>
    <title>FaceOne Settings</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        .section {
            margin-bottom: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title i {
            font-size: 16px;
            color: #666;
        }
        
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .mode-button {
            padding: 15px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .mode-button i {
            font-size: 24px;
            color: #666;
            transition: all 0.3s ease;
        }
        
        .mode-button.active {
            border-color: #2E7D32;
            background: linear-gradient(145deg, #2E7D32, #43A047);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }
        
        .mode-button.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            pointer-events: none;
        }
        
        .mode-button.active i {
            color: white;
            transform: scale(1.1);
        }
        
        .mode-button:not(.active) {
            opacity: 0.7;
        }
        
        .mode-button:not(.active):hover {
            opacity: 1;
            border-color: #4CAF50;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.1);
        }
        
        .mode-button:not(.active):hover i {
            color: #4CAF50;
        }
        
        /* Update section style to better frame the mode selector */
        .section:first-child {
            background: linear-gradient(to bottom, #fafafa, #f5f5f5);
            border: 1px solid #e0e0e0;
        }
        
        /* Add active mode indicator */
        .mode-button.active::before {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 14px;
            color: #A5D6A7;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .setting-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px;
            background: white;
            border-radius: 6px;
            transition: opacity 0.3s;
        }
        
        .setting-row.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .setting-label {
            flex: 1;
            font-size: 13px;
            display: flex;
            flex-direction: column;
        }
        
        .setting-description {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        
        .slider-container {
            margin-top: 15px;
            background: white;
            padding: 12px;
            border-radius: 6px;
        }
        
        .slider {
            width: 100%;
            margin: 10px 0;
        }
        
        .slider-value {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
            margin-left: 10px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }
        
        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider-toggle {
            background-color: #4CAF50;
        }
        
        input:checked + .slider-toggle:before {
            transform: translateX(20px);
        }
        
        .action-button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .action-button:hover {
            background: #45a049;
            transform: translateY(-1px);
        }
        
        .action-button:active {
            background: #3d8b40;
            transform: translateY(0);
        }
        
        .action-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-indicator {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
            min-height: 15px;
            transition: all 0.3s;
            opacity: 0;
            transform: translateY(-5px);
        }
        
        .status-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Icons */
        .material-icons {
            font-family: 'Material Icons';
            font-size: 20px;
        }
    </style>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="section">
        <div class="section-title">
            <i class="material-icons">tune</i>
            Choose Mode
        </div>
        <div class="mode-selector">
            <button id="faceDetectionMode" class="mode-button active">
                <i class="material-icons">face</i>
                Face Detection
            </button>
            <button id="blurMode" class="mode-button">
                <i class="material-icons">blur_on</i>
                Blur Mode
            </button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <i class="material-icons">settings</i>
            Settings
        </div>
        <div class="setting-row" data-mode="both">
            <div class="setting-label">
                <span>Auto Process Images</span>
                <span class="setting-description">Process images automatically as they appear</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="autoProcessImages">
                <span class="slider-toggle"></span>
            </label>
        </div>
        
        <div class="setting-row" data-mode="face_detection">
            <div class="setting-label">
                <span>Show Labels</span>
                <span class="setting-description">Display detection results and similarity scores</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="addLabel">
                <span class="slider-toggle"></span>
            </label>
        </div>
        
        <div class="setting-row" data-mode="face_detection">
            <div class="setting-label">
                <span>Show Face Frames</span>
                <span class="setting-description">Display colored frames around detected faces</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="frameFaceDetected">
                <span class="slider-toggle"></span>
            </label>
        </div>
        
        <div class="slider-container" data-mode="both">
            <div class="setting-label">
                <span>Confidence Threshold</span>
                <span class="setting-description">Minimum similarity percentage to consider a match</span>
            </div>
            <input type="range" id="confidenceThreshold" class="slider" min="0" max="100" step="1">
            <div class="slider-value" id="confidenceValue">70%</div>
        </div>
    </div>

    <div class="section">
        <button id="reprocessButton" class="action-button">
            <i class="material-icons">refresh</i>
            Reprocess All Images
        </button>
        <div id="statusIndicator" class="status-indicator"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
