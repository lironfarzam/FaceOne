<!DOCTYPE html>
<html>
<head>
    <title>TensorFlow.js Sandbox</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src blob:">
    <script src="tf.min.js"></script>
    <script src="tf-converter.min.js"></script>
</head>
<body>
    <script>
        let faceNetModel = null;
        let modelWarmedUp = false;
        let isInitialized = false;
        let isModelLoading = false;
        const modelCache = new Map();
        const MAX_CACHE_SIZE = 50;
        const CACHE_EXPIRY_TIME = 5 * 60 * 1000; // 5 minutes in milliseconds
        const INITIALIZATION_TIMEOUT = 10000; // 10 seconds timeout
        const MAX_RETRY_ATTEMPTS = 3;
        const MODEL_LOAD_TIMEOUT = 30000; // 30 seconds timeout for model loading
        let tfBackendInitialized = false;
        let tensorsToDispose = new Set();

        // Add cache for processed images
        const imageCache = {
            images: new Map(), // Map to store image data
            maxSize: 1000,
            
            add(src, isProcessed = true, canDelete = false) {
                if (this.images.size >= this.maxSize) {
                    // Remove oldest entry by converting to array and removing first element
                    const sources = Array.from(this.images.keys());
                    this.images.delete(sources[0]);
                }
                this.images.set(src, {
                    isProcessed,
                    canDelete,
                    timestamp: Date.now()
                });
            },
            
            has(src) {
                return this.images.has(src);
            },

            isProcessed(src) {
                const entry = this.images.get(src);
                return entry ? entry.isProcessed : false;
            },

            canDelete(src) {
                const entry = this.images.get(src);
                return entry ? entry.canDelete : false;
            },

            setProcessed(src, value = true) {
                const entry = this.images.get(src);
                if (entry) {
                    entry.isProcessed = value;
                    entry.timestamp = Date.now();
                }
            },

            setDeletable(src, value = true) {
                const entry = this.images.get(src);
                if (entry) {
                    entry.canDelete = value;
                    entry.timestamp = Date.now();
                }
            },

            clear() {
                this.images.clear();
            }
        };

        async function waitForBackend() {
            const startTime = Date.now();
            while (!tf.backend() && (Date.now() - startTime) < INITIALIZATION_TIMEOUT) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            if (!tf.backend()) {
                throw new Error('Backend initialization timeout');
            }
        }

        // Add function to safely check engine
        function isTfEngineAvailable() {
            try {
                return tf && tf.engine && tf.engine() && tf.engine().backend != null;
            } catch (e) {
                return false;
            }
        }

        // Modify safeDisposeTensors to be more defensive
        function safeDisposeTensors() {
            try {
                if (!isTfEngineAvailable()) return;
                
                const tensorsArray = Array.from(tensorsToDispose);
                tensorsToDispose.clear(); // Clear first to prevent circular issues
                
                tf.tidy(() => {
                    tensorsArray.forEach(tensor => {
                        try {
                            if (tensor && !tensor.isDisposed && tensor.dispose) {
                                tensor.dispose();
                            }
                        } catch (e) {
                            // Silently ignore disposal errors
                        }
                    });
                });
            } catch (e) {
                // Silently fail if cleanup isn't possible
            }
        }

        // Modify isTfBackendReady to use the new check
        function isTfBackendReady() {
            try {
                return isInitialized && isTfEngineAvailable() && tfBackendInitialized;
            } catch (e) {
                return false;
            }
        }

        // Modify initTensorFlow to track backend initialization
        async function initTensorFlow(retryCount = 0) {
            if (isTfBackendReady()) return;

            try {
                isInitialized = false;
                tfBackendInitialized = false;
                
                await tf.ready();
                await waitForBackend();
                
                if (!tf.findBackend('webgl')) {
                    console.warn('WebGL not available, using CPU backend');
                    await tf.setBackend('cpu');
                } else {
                    await tf.setBackend('webgl');
                    const backend = tf.backend();
                    
                    if (backend && backend.setWebGLFlag) {
                        backend.setWebGLFlag('WEBGL_FORCE_F16_TEXTURES', true);
                        backend.setWebGLFlag('WEBGL_VERSION', 2);
                        backend.setWebGLFlag('WEBGL_PACK', true);
                    }
                }

                isInitialized = true;
                tfBackendInitialized = true;
                
                window.parent.postMessage({
                    type: 'TF_INITIALIZED',
                    success: true,
                    info: {
                        version: tf.version.tfjs,
                        backend: tf.getBackend(),
                        isWebGL: tf.getBackend() === 'webgl'
                    }
                }, '*');
            } catch (error) {
                console.error('TensorFlow initialization error:', error);
                isInitialized = false;
                tfBackendInitialized = false;
                
                if (retryCount < MAX_RETRY_ATTEMPTS) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return initTensorFlow(retryCount + 1);
                }
                throw error;
            }
        }

        async function loadModel(modelPath) {
            if (isModelLoading) {
                console.warn('Model load already in progress');
                return;
            }

            try {
                isModelLoading = true;
                modelWarmedUp = false;

                if (!isInitialized || !tf.backend()) {
                    await initTensorFlow();
                }

                // Dispose existing model if any
                if (faceNetModel) {
                    try {
                        await faceNetModel.dispose();
                        faceNetModel = null;
                    } catch (e) {
                        console.warn('Error disposing existing model:', e);
                    }
                }

                // Load model with timeout
                const modelLoadPromise = tf.loadGraphModel(modelPath);
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Model load timeout')), MODEL_LOAD_TIMEOUT)
                );

                faceNetModel = await Promise.race([modelLoadPromise, timeoutPromise]);
                
                // Warm up with batched inputs
                const warmupBatchSize = 4;
                const dummyInputs = tf.tidy(() => tf.zeros([warmupBatchSize, 160, 160, 3]));
                
                const warmupResult = await faceNetModel.predict(dummyInputs);
                await warmupResult.data();  // Force execution
                
                tf.dispose([dummyInputs, warmupResult]);
                modelWarmedUp = true;
                
                window.parent.postMessage({
                    type: 'MODEL_LOADED',
                    success: true,
                    modelInfo: {
                        inputShape: faceNetModel.inputs[0].shape,
                        outputShape: faceNetModel.outputs[0].shape,
                        warmedUp: true
                    }
                }, '*');
            } catch (error) {
                console.error('Model loading error:', error);
                modelWarmedUp = false;
                faceNetModel = null;
                window.parent.postMessage({
                    type: 'MODEL_LOADED',
                    success: false,
                    error: error.message
                }, '*');
                throw error;
            } finally {
                isModelLoading = false;
            }
        }

        // Add cache entry with timestamp
        function addToCache(key, embedding) {
            if (modelCache.size >= MAX_CACHE_SIZE) {
                // Remove oldest entry
                const firstKey = modelCache.keys().next().value;
                modelCache.delete(firstKey);
            }
            modelCache.set(key, {
                embedding: Array.from(embedding),
                timestamp: Date.now()
            });
        }

        // Get cache entry if not expired
        function getFromCache(key) {
            const entry = modelCache.get(key);
            if (!entry) return null;
            
            // Check if entry has expired
            if (Date.now() - entry.timestamp > CACHE_EXPIRY_TIME) {
                modelCache.delete(key);
                return null;
            }
            
            return entry.embedding;
        }

        // Modify memory cleanup
        const memoryCleanupInterval = setInterval(() => {
            try {
                if (!isTfEngineAvailable()) return;

                tf.tidy(() => {
                    try {
                        const memoryInfo = tf.memory();
                        if (memoryInfo.numTensors > 100 || memoryInfo.numBytes > 50000000) {
                            console.warn('Memory usage:', {
                                tensors: memoryInfo.numTensors,
                                bytes: Math.round(memoryInfo.numBytes / (1024 * 1024)) + ' MB',
                                gpu: Math.round((memoryInfo.numBytesInGPU || 0) / (1024 * 1024)) + ' MB'
                            });
                            
                            if (memoryInfo.numTensors > 1000) {
                                safeDisposeTensors();
                                if (isTfEngineAvailable()) {
                                    try {
                                        tf.engine().endScope();
                                        tf.engine().startScope();
                                    } catch (e) {
                                        // Silently ignore scope errors
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        // Silently ignore memory info errors
                    }
                });
            } catch (error) {
                console.warn('Memory cleanup:', error);
            }
        }, 30000);

        // Modify visibility change handler to be more defensive
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                try {
                    if (isTfEngineAvailable()) {
                        safeDisposeTensors();
                    }
                    imageCache.clear();
                } catch (error) {
                    console.warn('Visibility cleanup:', error);
                }
            }
        });

        // Modify generateEmbedding
        async function generateEmbedding(imageData) {
            if (!isTfBackendReady()) {
                throw new Error('TensorFlow not initialized or ready');
            }

            if (!faceNetModel) {
                throw new Error('Model not loaded');
            }

            if (!modelWarmedUp) {
                throw new Error('Model not warmed up');
            }

            if (isModelLoading) {
                throw new Error('Model loading in progress');
            }

            return tf.tidy(() => {
                try {
                    const img = tf.tensor(imageData, [160, 160, 4]);
                    tensorsToDispose.add(img);
                    
                    const rgb = img.slice([0, 0, 0], [-1, -1, 3]);
                    tensorsToDispose.add(rgb);
                    
                    const processed = rgb.expandDims(0).toFloat().div(127.5).sub(1);
                    tensorsToDispose.add(processed);
                    
                    const embedding = faceNetModel.predict(processed);
                    tensorsToDispose.add(embedding);
                    
                    const embeddingData = embedding.squeeze();
                    tensorsToDispose.add(embeddingData);
                    
                    const normalizedEmbedding = tf.div(embeddingData, tf.norm(embeddingData));
                    tensorsToDispose.add(normalizedEmbedding);
                    
                    const finalEmbedding = normalizedEmbedding.dataSync();
                    
                    safeDisposeTensors();
                    
                    // Mark the image as processed in the cache if a source URL is provided
                    if (imageData.sourceUrl) {
                        imageCache.add(imageData.sourceUrl, true, false);
                    }
                    
                    return {
                        type: 'EMBEDDING_GENERATED',
                        success: true,
                        embedding: Array.from(finalEmbedding),
                        fromCache: false
                    };
                } catch (error) {
                    // Mark the image as failed in the cache if a source URL is provided
                    if (imageData.sourceUrl) {
                        imageCache.add(imageData.sourceUrl, false, false);
                    }
                    
                    safeDisposeTensors();
                    return {
                        type: 'EMBEDDING_GENERATED',
                        success: false,
                        error: error.message
                    };
                }
            });
        }

        // Modify cleanup before unload
        window.addEventListener('beforeunload', () => {
            try {
                // Clear interval first
                if (memoryCleanupInterval) {
                    clearInterval(memoryCleanupInterval);
                }

                // Safe cleanup of tensors
                safeDisposeTensors();

                // Only try engine cleanup if it's available
                if (isTfEngineAvailable()) {
                    try {
                        tf.engine().endScope();
                    } catch (e) {
                        // Silently ignore engine cleanup errors
                    }
                }

                // Clear caches and reset flags
                imageCache.clear();
                tensorsToDispose.clear();
                isInitialized = false;
                tfBackendInitialized = false;
                modelWarmedUp = false;
                
                // Clear model reference
                if (faceNetModel) {
                    try {
                        faceNetModel.dispose();
                    } catch (e) {
                        // Silently ignore model disposal errors
                    }
                    faceNetModel = null;
                }
            } catch (error) {
                // Log warning but don't throw
                console.warn('Cleanup during unload:', error);
            }
        }, { once: true });

        // Handle messages from content script with improved error handling
        window.addEventListener('message', async (event) => {
            try {
                const response = { type: event.data.type, success: false };
                
                switch (event.data.type) {
                    case 'INIT':
                        await initTensorFlow();
                        response.success = true;
                        break;
                        
                    case 'LOAD_MODEL':
                        // Check if model is already loading
                        if (isModelLoading) {
                            response.success = false;
                            response.error = 'Model load already in progress';
                            break;
                        }
                        await loadModel(event.data.modelPath);
                        response.success = true;
                        break;
                        
                    case 'GENERATE_EMBEDDING':
                        // Check if model is ready
                        if (!faceNetModel || !modelWarmedUp) {
                            throw new Error('FaceNet model not ready');
                        }
                        const result = await generateEmbedding(event.data.imageData);
                        window.parent.postMessage(result, '*');
                        return;
                        
                    case 'CLEAR_CACHE':
                        imageCache.clear();
                        if (isInitialized && tf.backend()) {
                            try {
                                await modelManager.cleanup();
                            } catch (e) {
                                console.warn('Error during cache cleanup:', e);
                            }
                        }
                        response.success = true;
                        break;

                    case 'CLEANUP':
                        try {
                            await modelManager.cleanup();
                            response.success = true;
                        } catch (e) {
                            console.warn('Error during cleanup:', e);
                            response.success = false;
                            response.error = e.message;
                        }
                        break;
                }
                
                window.parent.postMessage(response, '*');
            } catch (error) {
                console.error('Message handling error:', error);
                window.parent.postMessage({
                    type: event.data.type,
                    success: false,
                    error: error.message
                }, '*');
            }
        });

        // Initialize TensorFlow
        initTensorFlow().catch(console.error);

        class ModelManager {
            constructor() {
                this.models = {
                    faceNet: null,
                    faceDetector: null
                };
                
                this.state = {
                    isInitialized: false,
                    tfBackendInitialized: false,
                    modelLoadAttempts: 0,
                    isLoading: false,
                    warmedUp: {
                        faceNet: false,
                        faceDetector: false
                    }
                };
                
                this.constants = {
                    MAX_RETRY_ATTEMPTS: 3,
                    MODEL_LOAD_TIMEOUT: 30000,
                    INITIALIZATION_TIMEOUT: 10000
                };
            }

            async initialize() {
                if (this.state.isInitialized && this.state.tfBackendInitialized) return;

                try {
                    this.state.isInitialized = false;
                    this.state.tfBackendInitialized = false;
                    
                    await tf.ready();
                    await this.waitForBackend();
                    
                    if (!tf.findBackend('webgl')) {
                        console.warn('WebGL not available, using CPU backend');
                        await tf.setBackend('cpu');
                    } else {
                        await tf.setBackend('webgl');
                        const backend = tf.backend();
                        
                        if (backend && backend.setWebGLFlag) {
                            backend.setWebGLFlag('WEBGL_FORCE_F16_TEXTURES', true);
                            backend.setWebGLFlag('WEBGL_VERSION', 2);
                            backend.setWebGLFlag('WEBGL_PACK', true);
                        }
                    }

                    this.state.isInitialized = true;
                    this.state.tfBackendInitialized = true;
                    
                    return {
                        success: true,
                        info: {
                            version: tf.version.tfjs,
                            backend: tf.getBackend(),
                            isWebGL: tf.getBackend() === 'webgl'
                        }
                    };
                } catch (error) {
                    this.state.isInitialized = false;
                    this.state.tfBackendInitialized = false;
                    throw error;
                }
            }

            async waitForBackend() {
                const startTime = Date.now();
                while (!tf.backend() && (Date.now() - startTime) < this.constants.INITIALIZATION_TIMEOUT) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                if (!tf.backend()) {
                    throw new Error('Backend initialization timeout');
                }
            }

            async loadFaceNetModel(modelPath) {
                // Add loading lock with timeout
                const LOAD_TIMEOUT = 30000; // 30 seconds timeout
                
                if (this.state.isLoading) {
                    // Wait for existing load to complete
                    const startTime = Date.now();
                    while (this.state.isLoading && (Date.now() - startTime) < LOAD_TIMEOUT) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    if (this.state.isLoading) {
                        throw new Error('Model load timeout');
                    }
                }

                try {
                    this.state.isLoading = true;
                    this.state.warmedUp.faceNet = false;

                    if (!this.state.isInitialized) {
                        await this.initialize();
                    }

                    // Cleanup existing model
                    await this.disposeFaceNetModel();

                    // Load model with timeout
                    const modelLoadPromise = tf.loadGraphModel(modelPath);
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Model load timeout')), this.constants.MODEL_LOAD_TIMEOUT)
                    );

                    this.models.faceNet = await Promise.race([modelLoadPromise, timeoutPromise]);
                    
                    // Warm up
                    await this.warmupFaceNetModel();
                    
                    return {
                        success: true,
                        modelInfo: {
                            inputShape: this.models.faceNet.inputs[0].shape,
                            outputShape: this.models.faceNet.outputs[0].shape,
                            warmedUp: true
                        }
                    };
                } catch (error) {
                    this.state.warmedUp.faceNet = false;
                    this.models.faceNet = null;
                    throw error;
                } finally {
                    this.state.isLoading = false;
                }
            }

            async warmupFaceNetModel() {
                if (!this.models.faceNet) throw new Error('FaceNet model not loaded');

                const dummyInputs = tf.tidy(() => tf.zeros([1, 160, 160, 3]));
                const warmupResult = await this.models.faceNet.predict(dummyInputs);
                await warmupResult.data();
                tf.dispose([dummyInputs, warmupResult]);
                this.state.warmedUp.faceNet = true;
            }

            async disposeFaceNetModel() {
                if (this.models.faceNet) {
                    try {
                        await this.models.faceNet.dispose();
                        this.models.faceNet = null;
                        this.state.warmedUp.faceNet = false;
                    } catch (e) {
                        console.warn('Error disposing FaceNet model:', e);
                    }
                }
            }

            async generateEmbedding(imageData) {
                if (!this.isReady('faceNet')) {
                    throw new Error('FaceNet model not ready');
                }

                return tf.tidy(() => {
                    try {
                        const img = tf.tensor(imageData, [160, 160, 4]);
                        tensorsToDispose.add(img);
                        
                        const rgb = img.slice([0, 0, 0], [-1, -1, 3]);
                        tensorsToDispose.add(rgb);
                        
                        const processed = rgb.expandDims(0).toFloat().div(127.5).sub(1);
                        tensorsToDispose.add(processed);
                        
                        const embedding = this.models.faceNet.predict(processed);
                        tensorsToDispose.add(embedding);
                        
                        const embeddingData = embedding.squeeze();
                        tensorsToDispose.add(embeddingData);
                        
                        const normalizedEmbedding = tf.div(embeddingData, tf.norm(embeddingData));
                        tensorsToDispose.add(normalizedEmbedding);
                        
                        const finalEmbedding = normalizedEmbedding.dataSync();
                        
                        safeDisposeTensors();
                        
                        // Mark the image as processed in the cache if a source URL is provided
                        if (imageData.sourceUrl) {
                            imageCache.add(imageData.sourceUrl, true, false);
                        }
                        
                        return {
                            type: 'EMBEDDING_GENERATED',
                            success: true,
                            embedding: Array.from(finalEmbedding),
                            fromCache: false
                        };
                    } catch (error) {
                        // Mark the image as failed in the cache if a source URL is provided
                        if (imageData.sourceUrl) {
                            imageCache.add(imageData.sourceUrl, false, false);
                        }
                        
                        safeDisposeTensors();
                        return {
                            type: 'EMBEDDING_GENERATED',
                            success: false,
                            error: error.message
                        };
                    }
                });
            }

            isReady(modelName) {
                switch (modelName) {
                    case 'faceNet':
                        return this.state.isInitialized && 
                               this.state.tfBackendInitialized && 
                               this.models.faceNet && 
                               this.state.warmedUp.faceNet;
                    default:
                        return false;
                }
            }

            async cleanup() {
                try {
                    // First, clear all caches and reset flags
                    imageCache.clear();
                    modelCache.clear();
                    tensorsToDispose.clear();

                    // Reset all state flags
                    this.state.isInitialized = false;
                    this.state.tfBackendInitialized = false;
                    this.state.isLoading = false;
                    Object.keys(this.state.warmedUp).forEach(key => {
                        this.state.warmedUp[key] = false;
                    });

                    // Safely dispose models first
                    if (this.models.faceNet) {
                        try {
                            await this.models.faceNet.dispose();
                        } catch (e) {
                            console.warn('Error disposing FaceNet model:', e);
                        }
                        this.models.faceNet = null;
                    }

                    // Safely dispose any remaining tensors
                    try {
                        const tensors = tf.memory().numTensors;
                        if (tensors > 0) {
                            tf.disposeVariables();
                            tf.engine().endScope();
                            tf.engine().startScope();
                        }
                    } catch (e) {
                        console.warn('Error during tensor cleanup:', e);
                    }

                    // Reset global flags
                    isInitialized = false;
                    tfBackendInitialized = false;
                    modelWarmedUp = false;
                    isModelLoading = false;
                    faceNetModel = null;

                } catch (error) {
                    console.warn('Model cleanup error:', error);
                    // Even if there's an error, try to reset the state
                    this.state.isInitialized = false;
                    this.state.tfBackendInitialized = false;
                }
            }
        }

        // Create model manager instance
        const modelManager = new ModelManager();

        // Modify message handler to use model manager
        window.addEventListener('message', async (event) => {
            try {
                const response = { type: event.data.type, success: false };
                
                switch (event.data.type) {
                    case 'INIT':
                        const initResult = await modelManager.initialize();
                        response.success = initResult.success;
                        response.info = initResult.info;
                        break;
                        
                    case 'LOAD_MODEL':
                        const loadResult = await modelManager.loadFaceNetModel(event.data.modelPath);
                        response.success = loadResult.success;
                        response.modelInfo = loadResult.modelInfo;
                        break;
                        
                    case 'GENERATE_EMBEDDING':
                        const result = await modelManager.generateEmbedding(event.data.imageData);
                        window.parent.postMessage(result, '*');
                        return;
                        
                    case 'CLEAR_CACHE':
                        imageCache.clear();
                        if (modelManager.state.isInitialized) {
                            await modelManager.cleanup();
                        }
                        response.success = true;
                        break;

                    case 'CLEANUP':
                        await modelManager.cleanup();
                        response.success = true;
                        break;
                }
                
                window.parent.postMessage(response, '*');
            } catch (error) {
                console.error('Message handling error:', error);
                window.parent.postMessage({
                    type: event.data.type,
                    success: false,
                    error: error.message
                }, '*');
            }
        });

        // Initialize on load
        modelManager.initialize().catch(console.error);
    </script>
</body>
