<!DOCTYPE html>
<html>
<head>
    <title>TensorFlow.js Sandbox</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: chrome-extension:; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' chrome-extension: blob:; img-src 'self' data: blob: chrome-extension:; worker-src blob: 'self'">
    <script src="lib/tf.min.js"></script>
    <script src="lib/tf-converter.min.js"></script>
    <script src="js/memoryManager.js"></script>
</head>
<body>
    <script>

        console.log('#### STARTING SANDBOX.HTML ####');
        let faceNetModel = null;
        let modelWarmedUp = false;
        let isInitialized = false;
        let isModelLoading = false;
        const modelCache = new Map();
        const MAX_CACHE_SIZE = 50;
        const CACHE_EXPIRY_TIME = 5 * 60 * 1000; // 5 minutes in milliseconds
        const INITIALIZATION_TIMEOUT = 20000; // Increased to 20 seconds
        const MAX_RETRY_ATTEMPTS = 3;
        const MODEL_LOAD_TIMEOUT = 30000;
        let tfBackendInitialized = false;
        let tensorsToDispose = new Set();
        let initializationAttempts = 0;
        const MAX_INIT_ATTEMPTS = 3;

        // Add initialization status tracking
        const initStatus = {
            tfReady: false,
            backendReady: false,
            error: null
        };

        // Add cache for processed images
        const imageCache = {
            images: new Map(), // Map to store image data
            maxSize: 1000,
            
            add(src, isProcessed = true, canDelete = false) {
                if (this.images.size >= this.maxSize) {
                    // Remove oldest entry by converting to array and removing first element
                    const sources = Array.from(this.images.keys());
                    this.images.delete(sources[0]);
                }
                this.images.set(src, {
                    isProcessed,
                    canDelete,
                    timestamp: Date.now()
                });
            },
            
            has(src) {
                return this.images.has(src);
            },

            isProcessed(src) {
                const entry = this.images.get(src);
                return entry ? entry.isProcessed : false;
            },

            canDelete(src) {
                const entry = this.images.get(src);
                return entry ? entry.canDelete : false;
            },

            setProcessed(src, value = true) {
                const entry = this.images.get(src);
                if (entry) {
                    entry.isProcessed = value;
                    entry.timestamp = Date.now();
                }
            },

            setDeletable(src, value = true) {
                const entry = this.images.get(src);
                if (entry) {
                    entry.canDelete = value;
                    entry.timestamp = Date.now();
                }
            },

            clear() {
                this.images.clear();
            }
        };

        // Modify waitForBackend to be more robust
        async function waitForBackend(timeout = INITIALIZATION_TIMEOUT) {
            const startTime = Date.now();
            
            while (!tf.backend() && (Date.now() - startTime) < timeout) {
                try {
                    await tf.ready();
                    if (tf.backend()) {
                        initStatus.backendReady = true;
                        return true;
                    }
                } catch (e) {
                    console.warn('Backend initialization attempt failed:', e);
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            if (!tf.backend()) {
                throw new Error('Backend initialization timeout after ' + timeout + 'ms');
            }
            return true;
        }

        // Add function to safely check engine
        function isTfEngineAvailable() {
            try {
                return tf && tf.engine && tf.engine() && tf.engine().backend != null;
            } catch (e) {
                return false;
            }
        }

        // Modify safeDisposeTensors to be more defensive
        function safeDisposeTensors() {
            try {
                if (!isTfEngineAvailable()) return;
                
                const tensorsArray = Array.from(tensorsToDispose);
                tensorsToDispose.clear(); // Clear first to prevent circular issues
                
                tf.tidy(() => {
                    tensorsArray.forEach(tensor => {
                        try {
                            if (tensor && !tensor.isDisposed && tensor.dispose) {
                                tensor.dispose();
                            }
                        } catch (e) {
                            // Silently ignore disposal errors
                        }
                    });
                });
            } catch (e) {
                // Silently fail if cleanup isn't possible
            }
        }

        // Modify isTfBackendReady to use the new check
        function isTfBackendReady() {
            try {
                return isInitialized && isTfEngineAvailable() && tfBackendInitialized;
            } catch (e) {
                return false;
            }
        }

        // Initialize memory manager components
        function initializeMemoryComponents() {
            console.log('Initializing memory management components...');
            
            // Initialize TensorTracker if not already initialized
            if (typeof TensorTracker === 'function' && !window.tensorTracker) {
                try {
                    window.tensorTracker = new TensorTracker();
                    console.log('TensorTracker initialized');
                } catch (e) {
                    console.warn('Failed to initialize TensorTracker:', e);
                }
            }
            
            // Initialize MemoryAwareScheduler if not already initialized
            if (typeof MemoryAwareScheduler === 'function' && !window.memoryScheduler) {
                try {
                    window.memoryScheduler = new MemoryAwareScheduler();
                    console.log('MemoryAwareScheduler initialized');
                } catch (e) {
                    console.warn('Failed to initialize MemoryAwareScheduler:', e);
                }
            }
            
            // Initialize SmartImageCache if not already initialized
            if (typeof SmartImageCache === 'function' && !window.imageCache) {
                try {
                    window.imageCache = new SmartImageCache();
                    console.log('SmartImageCache initialized');
                } catch (e) {
                    console.warn('Failed to initialize SmartImageCache:', e);
                }
            }
        }

        // Modify initTensorFlow to use the new initialization function
        async function initTensorFlow(retryCount = 0) {
            if (isTfBackendReady()) {
                console.log('TensorFlow already initialized');
                return;
            }

            if (retryCount >= MAX_INIT_ATTEMPTS) {
                throw new Error('Max initialization attempts reached');
            }

            try {
                console.log('Initializing TensorFlow...');
                initializationAttempts++;
                
                // Reset status
                isInitialized = false;
                tfBackendInitialized = false;
                initStatus.tfReady = false;
                initStatus.backendReady = false;
                initStatus.error = null;

                // Wait for TF to be ready
                await tf.ready();
                initStatus.tfReady = true;
                console.log('TensorFlow core ready');

                // Try to initialize backend
                await waitForBackend();
                console.log('Backend initialized');

                // Set up WebGL backend if available
                if (!tf.findBackend('webgl')) {
                    console.warn('WebGL not available, using CPU backend');
                    await tf.setBackend('cpu');
                } else {
                    await tf.setBackend('webgl');
                    const backend = tf.backend();
                    
                    if (backend && backend.setWebGLFlag) {
                        backend.setWebGLFlag('WEBGL_FORCE_F16_TEXTURES', true);
                        backend.setWebGLFlag('WEBGL_VERSION', 2);
                        backend.setWebGLFlag('WEBGL_PACK', true);
                    }
                }

                // Verify initialization
                if (!tf.backend()) {
                    throw new Error('Backend not properly initialized');
                }

                isInitialized = true;
                tfBackendInitialized = true;

                // Initialize memory management components
                initializeMemoryComponents();

                // Set up periodic leak detection if TensorTracker is available
                if (window.tensorTracker && typeof window.tensorTracker.setDebugMode === 'function') {
                    // Enable debug mode in development environments
                    const isDevMode = new URLSearchParams(window.location.search).has('debug');
                    window.tensorTracker.setDebugMode(isDevMode);
                    
                    // Set up periodic leak detection
                    setInterval(() => {
                        if (window.tensorTracker && typeof window.tensorTracker.getLeaks === 'function') {
                            const leaks = window.tensorTracker.getLeaks(30000); // 30 seconds
                            if (leaks.length > 0) {
                                console.warn('Potential tensor leaks detected:', leaks);
                            }
                        }
                    }, 60000); // Check every minute
                }

                // Send success message
                window.parent.postMessage({
                    type: 'TF_INITIALIZED',
                    success: true,
                    info: {
                        version: tf.version.tfjs,
                        backend: tf.getBackend(),
                        isWebGL: tf.getBackend() === 'webgl',
                        memoryInfo: tf.memory()
                    }
                }, '*');

                console.log('TensorFlow initialization complete');
                
            } catch (error) {
                console.error('TensorFlow initialization error:', error);
                initStatus.error = error;
                
                // Clean up on error
                try {
                    if (tf.backend()) {
                        await tf.disposeVariables();
                        tf.engine().endScope();
                    }
                } catch (e) {
                    console.warn('Cleanup error:', e);
                }

                isInitialized = false;
                tfBackendInitialized = false;

                if (retryCount < MAX_INIT_ATTEMPTS - 1) {
                    console.log(`Retrying initialization (attempt ${retryCount + 2}/${MAX_INIT_ATTEMPTS})`);
                    await new Promise(resolve => setTimeout(resolve, 1000 * (retryCount + 1)));
                    return initTensorFlow(retryCount + 1);
                }

                window.parent.postMessage({
                    type: 'TF_INITIALIZED',
                    success: false,
                    error: error.message,
                    initStatus: initStatus
                }, '*');
                
                throw error;
            }
        }

        // Add function to check TF status
        function getTfStatus() {
            return {
                isInitialized,
                tfBackendInitialized,
                backend: tf.getBackend(),
                initStatus: { ...initStatus },
                memory: tf.memory(),
                attempts: initializationAttempts,
                memoryStats: window.tensorTracker ? window.tensorTracker.getStats() : null
            };
        }

        // Modify loadModel to use tensor tracking
        async function loadModel(modelPath) {
            if (isModelLoading) {
                console.warn('Model load already in progress');
                return;
            }

            try {
                isModelLoading = true;
                modelWarmedUp = false;
                
                // Report loading started
                window.parent.postMessage({
                    type: 'MODEL_LOADING_STATUS',
                    status: 'started',
                    modelPath: modelPath
                }, '*');

                if (!isInitialized || !tf.backend()) {
                    console.log('TensorFlow not initialized, initializing now...');
                    await initTensorFlow();
                }
                
                // Ensure TensorTracker is initialized
                if (!window.tensorTracker && typeof TensorTracker === 'function') {
                    try {
                        window.tensorTracker = new TensorTracker();
                        console.log('TensorTracker initialized during model loading');
                    } catch (e) {
                        console.warn('Failed to initialize TensorTracker:', e);
                        // Continue without tensor tracking
                    }
                }

                // Dispose existing model if any
                if (faceNetModel) {
                    try {
                        console.log('Disposing existing model...');
                        await faceNetModel.dispose();
                        faceNetModel = null;
                    } catch (e) {
                        console.warn('Error disposing existing model:', e);
                    }
                }

                // Increase timeout for model loading
                const MODEL_LOAD_TIMEOUT = 60000; // 60 seconds
                
                console.log(`Loading model from ${modelPath}...`);
                
                // Load model with timeout and progress reporting
                const modelLoadPromise = new Promise((resolve, reject) => {
                    // Use tf.loadGraphModel with onProgress callback
                    const modelPromise = tf.loadGraphModel(modelPath, {
                        onProgress: (fraction) => {
                            // Report loading progress
                            window.parent.postMessage({
                                type: 'MODEL_LOADING_PROGRESS',
                                progress: Math.round(fraction * 100),
                                modelPath: modelPath
                            }, '*');
                        }
                    });
                    
                    modelPromise.then(resolve).catch(reject);
                });
                
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error(`Model load timeout after ${MODEL_LOAD_TIMEOUT}ms`)), MODEL_LOAD_TIMEOUT)
                );

                console.log('Waiting for model to load...');
                faceNetModel = await Promise.race([modelLoadPromise, timeoutPromise]);
                console.log('Model loaded successfully');
                
                // Report model loaded before warmup
                window.parent.postMessage({
                    type: 'MODEL_LOADING_STATUS',
                    status: 'loaded',
                    modelPath: modelPath
                }, '*');
                
                // Determine model type and create appropriate warmup inputs
                console.log('Warming up model...');
                let dummyInputs;
                await tf.tidy(() => {
                    try {
                        if (modelPath.includes('myModel')) {
                            // For similarity model that takes two 512-dim vectors
                            if (window.tensorTracker && typeof window.tensorTracker.track === 'function') {
                                dummyInputs = [
                                    window.tensorTracker.track(tf.zeros([1, 512]), 'warmup:myModel:input1'),
                                    window.tensorTracker.track(tf.zeros([1, 512]), 'warmup:myModel:input2')
                                ];
                            } else {
                                dummyInputs = [
                                    tf.zeros([1, 512]),
                                    tf.zeros([1, 512])
                                ];
                            }
                        } else {
                            // For FaceNet model
                            if (window.tensorTracker && typeof window.tensorTracker.track === 'function') {
                                dummyInputs = window.tensorTracker.track(tf.zeros([1, 160, 160, 3]), 'warmup:faceNet:input');
                            } else {
                                dummyInputs = tf.zeros([1, 160, 160, 3]);
                            }
                        }
                        
                        // Warm up with appropriate inputs
                        const warmupResult = faceNetModel.predict(dummyInputs);
                        
                        // Track warmup result
                        if (window.tensorTracker && typeof window.tensorTracker.track === 'function') {
                            if (Array.isArray(warmupResult)) {
                                warmupResult.forEach((tensor, i) => {
                                    window.tensorTracker.track(tensor, `warmup:result:${i}`);
                                });
                            } else {
                                window.tensorTracker.track(warmupResult, 'warmup:result');
                            }
                        }
                        
                        console.log('Model warmup complete');
                    } catch (e) {
                        console.warn('Error during model warmup:', e);
                        // Continue even if warmup fails
                    }
                });
                
                modelWarmedUp = true;
                
                // Force garbage collection after model loading
                if (window.tensorTracker && typeof window.tensorTracker.disposeAll === 'function') {
                    window.tensorTracker.disposeAll();
                }
                
                // Report success with model info
                window.parent.postMessage({
                    type: 'MODEL_LOADED',
                    success: true,
                    modelInfo: {
                        inputShape: Array.isArray(faceNetModel.inputs) ? 
                            faceNetModel.inputs.map(input => input.shape) :
                            faceNetModel.inputs[0].shape,
                        outputShape: Array.isArray(faceNetModel.outputs) ?
                            faceNetModel.outputs.map(output => output.shape) :
                            faceNetModel.outputs[0].shape,
                        warmedUp: true,
                        memoryInfo: tf.memory()
                    }
                }, '*');
            } catch (error) {
                console.error('Model loading error:', error);
                modelWarmedUp = false;
                faceNetModel = null;
                
                // Report failure with detailed error
                window.parent.postMessage({
                    type: 'MODEL_LOADED',
                    success: false,
                    error: error.message,
                    stack: error.stack,
                    modelPath: modelPath
                }, '*');
                
                throw error;
            } finally {
                isModelLoading = false;
                
                // Force cleanup after model loading regardless of success/failure
                performMemoryCleanup();
            }
        }

        // Add cache entry with timestamp
        function addToCache(key, embedding) {
            if (modelCache.size >= MAX_CACHE_SIZE) {
                // Remove oldest entry
                const firstKey = modelCache.keys().next().value;
                modelCache.delete(firstKey);
            }
            modelCache.set(key, {
                embedding: Array.from(embedding),
                timestamp: Date.now()
            });
        }

        // Get cache entry if not expired
        function getFromCache(key) {
            const entry = modelCache.get(key);
            if (!entry) return null;
            
            // Check if entry has expired
            if (Date.now() - entry.timestamp > CACHE_EXPIRY_TIME) {
                modelCache.delete(key);
                return null;
            }
            
            return entry.embedding;
        }

        // Modify memory cleanup to use our new memory manager
        function performMemoryCleanup(force = false) {
            try {
                if (!isTfEngineAvailable()) return;

                // Use our tensor tracker if available
                if (window.tensorTracker) {
                    const leaks = window.tensorTracker.getLeaks(force ? 10000 : 60000); // 1 minute or 10 seconds if forced
                    if (leaks.length > 0) {
                        console.warn('Cleaning up leaked tensors:', leaks.length);
                        window.tensorTracker.disposeAll();
                    }
                }

                // Check memory usage
                const memoryInfo = tf.memory();
                const tensorsThreshold = force ? 100 : 500;
                const bytesThreshold = force ? 10000000 : 50000000;
                
                if (memoryInfo.numTensors > tensorsThreshold || memoryInfo.numBytes > bytesThreshold) {
                    console.warn('Memory usage:', {
                        tensors: memoryInfo.numTensors,
                        bytes: Math.round(memoryInfo.numBytes / (1024 * 1024)) + ' MB',
                        gpu: Math.round((memoryInfo.numBytesInGPU || 0) / (1024 * 1024)) + ' MB'
                    });
                    
                    // More aggressive cleanup for high memory usage
                    if (memoryInfo.numTensors > 1000 || force) {
                        console.log('Performing aggressive memory cleanup');
                        
                        if (window.tensorTracker) {
                            window.tensorTracker.disposeAll();
                        }
                        
                        // Clear model cache if memory pressure is high
                        if (memoryInfo.numTensors > 2000 || memoryInfo.numBytes > 200000000) {
                            console.log('Clearing model cache due to high memory pressure');
                            modelCache.clear();
                        }
                        
                        if (isTfEngineAvailable()) {
                            try {
                                // Try to force garbage collection
                                tf.engine().endScope();
                                tf.engine().startScope();
                                
                                // If still high, try more aggressive approach
                                if (tf.memory().numTensors > 1000) {
                                    console.log('Attempting more aggressive cleanup');
                                    tf.disposeVariables();
                                    tf.engine().endScope();
                                    tf.engine().startScope();
                                }
                            } catch (e) {
                                console.warn('Error during aggressive cleanup:', e);
                            }
                        }
                    }
                }
                
                return tf.memory();
            } catch (error) {
                console.warn('Memory cleanup error:', error);
                return null;
            }
        }

        // Set up periodic memory cleanup
        const memoryCleanupInterval = setInterval(() => performMemoryCleanup(false), 30000);

        // Modify visibility change handler to be more defensive
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                try {
                    if (isTfEngineAvailable()) {
                        if (window.tensorTracker) {
                            window.tensorTracker.disposeAll();
                        }
                    }
                    if (window.imageCache) {
                        window.imageCache.cleanup();
                    }
                } catch (error) {
                    console.warn('Visibility cleanup:', error);
                }
            }
        });

        // Modify generateEmbedding to use tensor tracking and memory-aware scheduling
        async function generateEmbedding(imageData) {
            if (!isTfBackendReady()) {
                throw new Error('TensorFlow not initialized or ready');
            }

            if (!faceNetModel) {
                throw new Error('Model not loaded');
            }

            if (!modelWarmedUp) {
                throw new Error('Model not warmed up');
            }

            if (isModelLoading) {
                throw new Error('Model loading in progress');
            }

            // Use memory-aware scheduler if available
            if (window.memoryScheduler) {
                return window.memoryScheduler.enqueue(() => {
                    return generateEmbeddingInternal(imageData);
                });
            } else {
                return generateEmbeddingInternal(imageData);
            }
        }

        // Internal function to generate embeddings with tensor tracking
        function generateEmbeddingInternal(imageData) {
            return tf.tidy(() => {
                try {
                    // Check if TensorTracker is available and has track method
                    const hasTensorTracker = window.tensorTracker && typeof window.tensorTracker.track === 'function';
                    
                    // Convert image data to tensor and track it
                    const img = hasTensorTracker ? 
                        window.tensorTracker.track(tf.tensor(imageData, [160, 160, 4]), 'embedding:input') :
                        tf.tensor(imageData, [160, 160, 4]);
                    
                    // Extract RGB channels
                    const rgb = hasTensorTracker ?
                        window.tensorTracker.track(img.slice([0, 0, 0], [-1, -1, 3]), 'embedding:rgb') :
                        img.slice([0, 0, 0], [-1, -1, 3]);
                    
                    // Preprocess for model input
                    const processed = hasTensorTracker ?
                        window.tensorTracker.track(rgb.expandDims(0).toFloat().div(127.5).sub(1), 'embedding:processed') :
                        rgb.expandDims(0).toFloat().div(127.5).sub(1);
                    
                    // Generate embedding
                    const embedding = hasTensorTracker ?
                        window.tensorTracker.track(faceNetModel.predict(processed), 'embedding:raw') :
                        faceNetModel.predict(processed);
                    
                    const embeddingData = hasTensorTracker ?
                        window.tensorTracker.track(embedding.squeeze(), 'embedding:squeezed') :
                        embedding.squeeze();
                    
                    // Normalize embedding
                    const normalizedEmbedding = hasTensorTracker ?
                        window.tensorTracker.track(tf.div(embeddingData, tf.norm(embeddingData)), 'embedding:normalized') :
                        tf.div(embeddingData, tf.norm(embeddingData));
                    
                    // Convert to regular array
                    const finalEmbedding = normalizedEmbedding.dataSync();
                    
                    // Mark the image as processed in the cache if a source URL is provided
                    if (imageData.sourceUrl && window.imageCache && typeof window.imageCache.set === 'function') {
                        window.imageCache.set(imageData.sourceUrl, {
                            processed: true,
                            timestamp: Date.now()
                        });
                    }
                    
                    return {
                        type: 'EMBEDDING_GENERATED',
                        success: true,
                        embedding: Array.from(finalEmbedding),
                        fromCache: false
                    };
                } catch (error) {
                    // Mark the image as failed in the cache if a source URL is provided
                    if (imageData.sourceUrl && window.imageCache && typeof window.imageCache.set === 'function') {
                        window.imageCache.set(imageData.sourceUrl, {
                            processed: false,
                            error: error.message,
                            timestamp: Date.now()
                        });
                    }
                    
                    return {
                        type: 'EMBEDDING_GENERATED',
                        success: false,
                        error: error.message
                    };
                }
            });
        }

        // Modify cleanup before unload
        window.addEventListener('beforeunload', () => {
            try {
                // Clear interval first
                if (memoryCleanupInterval) {
                    clearInterval(memoryCleanupInterval);
                }

                // Safe cleanup of tensors
                if (window.tensorTracker) {
                    window.tensorTracker.disposeAll();
                }

                // Only try engine cleanup if it's available
                if (isTfEngineAvailable()) {
                    try {
                        tf.engine().endScope();
                    } catch (e) {
                        // Silently ignore engine cleanup errors
                    }
                }

                // Clear caches and reset flags
                if (window.imageCache) {
                    window.imageCache.cleanup();
                }
                
                isInitialized = false;
                tfBackendInitialized = false;
                modelWarmedUp = false;
                
                // Clear model reference
                if (faceNetModel) {
                    try {
                        faceNetModel.dispose();
                    } catch (e) {
                        // Silently ignore model disposal errors
                    }
                    faceNetModel = null;
                }
            } catch (error) {
                // Log warning but don't throw
                console.warn('Cleanup during unload:', error);
            }
        }, { once: true });

        // Add a health check handler
        function handleHealthCheck() {
            // Perform a light cleanup during health check
            const memoryInfo = performMemoryCleanup(false);
            
            // Check if TF is responsive by running a simple operation
            let tfResponsive = false;
            try {
                if (isTfEngineAvailable()) {
                    const testTensor = tf.tensor1d([1, 2, 3]);
                    const result = testTensor.square();
                    result.dispose();
                    testTensor.dispose();
                    tfResponsive = true;
                }
            } catch (e) {
                console.warn('TensorFlow responsiveness check failed:', e);
            }
            
            return {
                type: 'HEALTH_CHECK_RESPONSE',
                status: tfResponsive ? 'ok' : 'tf_unresponsive',
                timestamp: Date.now(),
                memoryInfo: memoryInfo || (tf.memory ? tf.memory() : null),
                tensorStats: window.tensorTracker ? window.tensorTracker.getStats() : null,
                cacheStats: window.imageCache ? window.imageCache.getStats() : null,
                schedulerStats: window.memoryScheduler ? window.memoryScheduler.getStats() : null,
                modelStatus: {
                    modelLoaded: faceNetModel !== null,
                    modelWarmedUp: modelWarmedUp,
                    isModelLoading: isModelLoading
                },
                tfStatus: {
                    isInitialized,
                    tfBackendInitialized,
                    backend: tf.getBackend ? tf.getBackend() : null
                }
            };
        }

        // Add a cleanup handler
        async function handleCleanup() {
            try {
                // Dispose all tracked tensors
                if (window.tensorTracker) {
                    try {
                        // Check if disposeAll method exists
                        if (typeof window.tensorTracker.disposeAll === 'function') {
                            window.tensorTracker.disposeAll();
                        } else if (window.tensorTracker.track) {
                            // Fallback: manually dispose tensors in track
                            try {
                                for (const tensor of window.tensorTracker.track) {
                                    if (tensor && typeof tensor.dispose === 'function') {
                                        tensor.dispose();
                                    }
                                }
                            } catch (tensorError) {
                                console.warn('Error disposing individual tensors:', tensorError);
                            }
                        }
                        
                        // Reset stats if method exists
                        if (typeof window.tensorTracker.resetStats === 'function') {
                            window.tensorTracker.resetStats();
                        }
                    } catch (e) {
                        console.warn('Error during tensor cleanup:', e);
                    }
                }
                
                // Clean up image cache
                if (window.imageCache && typeof window.imageCache.cleanup === 'function') {
                    try {
                        window.imageCache.cleanup();
                    } catch (e) {
                        console.warn('Error during image cache cleanup:', e);
                    }
                }
                
                // Force TF engine cleanup
                if (isTfEngineAvailable()) {
                    try {
                        tf.engine().endScope();
                        tf.engine().startScope();
                        
                        // More aggressive cleanup
                        performMemoryCleanup(true);
                    } catch (e) {
                        console.warn('Error during TF engine cleanup:', e);
                    }
                }
                
                return {
                    type: 'RESPONSE',
                    success: true,
                    operation: 'cleanup',
                    timestamp: Date.now(),
                    memoryInfo: tf.memory ? tf.memory() : null
                };
            } catch (error) {
                console.warn('Cleanup error:', error);
                return {
                    type: 'RESPONSE',
                    success: false,
                    operation: 'cleanup',
                    error: error.message,
                    timestamp: Date.now()
                };
            }
        }

        // Main message handler
        window.addEventListener('message', async (event) => {
            try {
                const data = event.data;
                if (!data || !data.type) return;
                
                let response = { type: data.type, success: false };
                
                switch (data.type) {
                    case 'INIT':
                        await initTensorFlow();
                        response.success = true;
                        response.info = {
                            version: tf.version.tfjs,
                            backend: tf.getBackend(),
                            isWebGL: tf.getBackend() === 'webgl'
                        };
                        break;
                        
                    case 'LOAD_MODEL':
                        await loadModel(data.modelPath);
                        return; // loadModel sends its own response
                        
                    case 'GENERATE_EMBEDDING':
                        const result = await generateEmbedding(data.imageData);
                        window.parent.postMessage(result, '*');
                        return;
                        
                    case 'COMPUTE_SIMILARITY':
                        try {
                            if (!isTfBackendReady()) {
                                throw new Error('TensorFlow not initialized or ready');
                            }
                            
                            if (!faceNetModel) {
                                throw new Error('Model not loaded');
                            }
                            
                            // Validate input data
                            if (!Array.isArray(data.embedding1) || !Array.isArray(data.embedding2)) {
                                throw new Error('Invalid embedding format: embeddings must be arrays');
                            }
                            
                            if (data.embedding1.length !== data.embedding2.length) {
                                throw new Error(`Embedding dimension mismatch: ${data.embedding1.length} vs ${data.embedding2.length}`);
                            }
                            
                            // Compute similarity using cosine similarity
                            const similarity = await tf.tidy(() => {
                                try {
                                    console.log('Computing similarity between embeddings');
                                    
                                    // Create tensors from embeddings
                                    const embedding1 = tf.tensor1d(data.embedding1);
                                    const embedding2 = tf.tensor1d(data.embedding2);
                                    
                                    // Normalize embeddings
                                    const normalized1 = tf.div(embedding1, tf.norm(embedding1));
                                    const normalized2 = tf.div(embedding2, tf.norm(embedding2));
                                    
                                    // Compute dot product (cosine similarity for normalized vectors)
                                    const similarity = tf.sum(tf.mul(normalized1, normalized2)).dataSync()[0];
                                    
                                    console.log('Similarity computed:', similarity);
                                    return similarity;
                                } catch (innerError) {
                                    console.error('Error during similarity computation:', innerError);
                                    throw innerError;
                                }
                            });
                            
                            response = {
                                type: 'RESPONSE',
                                success: true,
                                similarity: similarity,
                                requestId: data.requestId
                            };
                        } catch (error) {
                            console.error('Similarity computation error:', error);
                            response = {
                                type: 'RESPONSE',
                                success: false,
                                error: error.message,
                                requestId: data.requestId
                            };
                        }
                        break;
                        
                    case 'HEALTH_CHECK':
                        response = handleHealthCheck();
                        break;
                        
                    case 'CLEANUP':
                        response = await handleCleanup();
                        break;
                        
                    case 'GET_TF_STATUS':
                        response = {
                            type: 'TF_STATUS',
                            status: getTfStatus()
                        };
                        break;
                        
                    default:
                        console.warn('Unknown message type:', data.type);
                        response.error = 'Unknown message type';
                }
                
                window.parent.postMessage(response, '*');
            } catch (error) {
                console.error('Message handling error:', error);
                window.parent.postMessage({
                    type: event.data?.type || 'ERROR',
                    success: false,
                    error: error.message,
                    id: event.data?.id // Include the request ID for sandboxManager
                }, '*');
            }
        });

        // Initialize TensorFlow on load with error handling
        window.addEventListener('load', () => {
            console.log('Sandbox frame loaded, initializing TensorFlow...');
            
            // Initialize memory components first
            try {
                initializeMemoryComponents();
            } catch (e) {
                console.warn('Failed to initialize memory components:', e);
            }
            
            // Send ready message to parent
            window.parent.postMessage({
                type: 'SANDBOX_READY',
                success: true
            }, '*');
            
            initTensorFlow().catch(error => {
                console.error('Initial TF initialization failed:', error);
                window.parent.postMessage({
                    type: 'TF_INITIALIZED',
                    success: false,
                    error: error.message,
                    status: getTfStatus()
                }, '*');
            });
        });
    </script>
</body>
