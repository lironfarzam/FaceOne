<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Replacer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Face Replacer</h1>
    <div id="loading">Loading face replacement module...</div>
    <div id="controls" style="display: none;">
      <button id="start">Start Face Replacement</button>
      <button id="stop">Stop Face Replacement</button>
      <div id="status">Status: <span id="status-text">Idle</span></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
